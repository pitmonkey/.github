name: Reusable - Dependabot auto-merge

# Enables GitHub's native auto-merge on Dependabot pull requests that only touch
# dev tooling. `--auto` holds the merge until the branch's required status checks
# pass, which across this org is the single `ci-green` context. Runtime/production
# dependencies do not match the filter and fall through untouched.
#
# SECURITY: callers invoke this from `pull_request_target`, which runs with write
# permissions against the base repo. This workflow must never check out or execute
# pull request code. Do not add a checkout step.

on:
  workflow_call:
    inputs:
      app-client-id:
        description: GitHub App client ID; empty preserves legacy GITHUB_TOKEN auto-merge
        type: string
        default: ''
    secrets:
      app-private-key:
        description: Private key for app-client-id; required when opting into App authentication
        required: false

jobs:
  dev-tooling-automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        # Grouped PRs can omit the YAML closing marker (…), causing fetch-metadata
        # to fail with "PR does not contain metadata". That is not a real error —
        # empty outputs simply mean the auto-merge condition below evaluates false
        # and the step that enables auto-merge is skipped. Always exit green.
        continue-on-error: true

      # dependency-type resolves to the most-privileged type in the pull request,
      # so a grouped PR only reads as development when every member is a dev dep.
      # Dependabot has no dev/prod concept for pre-commit or github-actions and
      # reports both as direct:production, hence the explicit ecosystem clauses.
      # App-attributed merges trigger push CI. GITHUB_TOKEN merges do not.
      # Restrict this token to the caller repo, including workflow updates so
      # github_actions bumps can merge. Never grant branch-protection bypass.
      - name: Generate auto-merge App token
        id: app-token
        if: >-
          inputs.app-client-id != '' &&
          (steps.meta.outputs.dependency-type == 'direct:development' ||
          steps.meta.outputs.package-ecosystem == 'pre_commit' ||
          steps.meta.outputs.package-ecosystem == 'github_actions')
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Enable auto-merge for dev-tooling updates
        if: >-
          steps.meta.outputs.dependency-type == 'direct:development' ||
          steps.meta.outputs.package-ecosystem == 'pre_commit' ||
          steps.meta.outputs.package-ecosystem == 'github_actions'
        run: |
          if [[ -n "$APP_CLIENT_ID" ]]; then
            # Never silently fall back if an opted-in caller has broken App auth.
            export GH_TOKEN="${APP_TOKEN:?GitHub App token is empty}"
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_CLIENT_ID: ${{ inputs.app-client-id }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
