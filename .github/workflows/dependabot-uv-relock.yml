name: Reusable - Dependabot uv re-lock

# Re-locks every uv project in the caller repo on a Dependabot `uv` pull request and pushes
# any changed `uv.lock` files back to the PR branch as the pitmonkey-coder App.
#
# Why: Dependabot re-locks only the directory it bumps. In a repo whose components depend
# on a shared package through a uv path source, the dependents' locks go stale (see
# pitmonkey/github-dispatcher#297). A caller running CI with `uv-sync-args: --locked` turns
# that into a red PR. This workflow turns the red PR back green without a human.
#
# SECURITY: callers invoke this from `pull_request_target`, which runs with the base repo's
# secrets. `uv lock` can execute build backends (path packages, sdists without static
# metadata), so the work is split in two jobs:
#   relock  runs the PR's code, holding only a read-only GITHUB_TOKEN, no persisted
#           credential and no App token. It emits a patch.
#   push    never runs PR code: it rejects any patch touching anything but a uv.lock,
#           then mints the App token, applies the patch, commits and pushes.
# Never mint the App token in `relock`, and never run `uv` or repo scripts in `push`.
#
# Every `${{ }}` that carries PR-controlled text (branch names, paths) reaches a shell only
# through `env:`, never by inline interpolation into `run:`.

on:
  workflow_call:
    inputs:
      app-client-id:
        description: GitHub App client ID used to push the re-lock commit
        type: string
        required: true
      runner:
        type: string
        default: pi-arm64
      paths-ignore-glob:
        description: Bash glob; directories (relative to the repo root, "." for the root) that match are not re-locked
        type: string
        default: ""
    secrets:
      app-private-key:
        description: Private key for app-client-id
        required: true
      ops-ui-token:
        description: Read-only PAT for private uv git dependencies (same role as OPS_UI_TOKEN in test-python.yml)
        required: false

jobs:
  relock:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/uv/')
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      # Same private-dependency rewrite and empty-secret guard as test-python.yml: step env
      # only (never `git config --global` on a self-hosted runner), and GIT_CONFIG_COUNT 0
      # when the token is absent so public fetches are not rewritten to an empty credential.
      # Under `pull_request_target` the caller maps the Actions-scope OPS_UI_TOKEN.
      - name: Re-lock every uv project
        env:
          IGNORE_GLOB: ${{ inputs.paths-ignore-glob }}
          GIT_CONFIG_COUNT: ${{ secrets.ops-ui-token != '' && 1 || 0 }}
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ secrets.ops-ui-token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
        run: |
          set -euo pipefail
          git ls-files -z -- '*uv.lock' | while IFS= read -r -d '' lock; do
            dir=$(dirname -- "$lock")
            # Unquoted on purpose: IGNORE_GLOB is a glob pattern.
            # shellcheck disable=SC2053
            if [[ -n "$IGNORE_GLOB" && "$dir" == $IGNORE_GLOB ]]; then
              echo "skip $dir (paths-ignore-glob)"
              continue
            fi
            echo "uv lock in $dir"
            uv lock --directory "$dir"
          done
      - name: Collect lock changes
        id: diff
        run: |
          set -euo pipefail
          git diff --binary -- '*uv.lock' > relock.patch
          if [[ -s relock.patch ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- '*uv.lock'
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "every uv.lock is already current"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uv-relock-patch
          path: relock.patch
          retention-days: 1

  push:
    needs: relock
    if: needs.relock.outputs.changed == 'true'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: uv-relock-patch
          path: ${{ runner.temp }}/uv-relock
      # The patch came out of a job that ran PR code. Accept it only if every path it
      # touches is a file named uv.lock that already exists, and it creates, deletes,
      # renames or re-modes nothing.
      - name: Verify the patch only edits uv.lock files
        env:
          PATCH_FILE: ${{ runner.temp }}/uv-relock/relock.patch
        run: |
          set -euo pipefail
          if grep -Eq '^(new file mode|deleted file mode|old mode|new mode|rename from|rename to|copy from|copy to|similarity index) ' "$PATCH_FILE"; then
            echo "::error::re-lock patch creates, deletes, renames or re-modes a file; refusing it"
            exit 1
          fi
          paths=$(git apply --numstat -z "$PATCH_FILE" | tr '\0' '\n' | awk -F'\t' 'NF >= 3 {print $3}')
          if [[ -z "$paths" ]]; then
            echo "::error::re-lock patch names no files; refusing it"
            exit 1
          fi
          while IFS= read -r path; do
            if [[ "$(basename -- "$path")" != "uv.lock" ]]; then
              echo "::error::re-lock patch touches $path, which is not a uv.lock; refusing it"
              exit 1
            fi
          done <<< "$paths"
          git apply --check "$PATCH_FILE"
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
      - name: Commit and push the re-locked files
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PATCH_FILE: ${{ runner.temp }}/uv-relock/relock.patch
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          : "${APP_TOKEN:?GitHub App token is empty}"
          # The credential rides in env-scoped git config for this step only, never in a
          # URL (process listings) or the runner's global config.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          basic=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"
          remote="https://github.com/${REPO}.git"
          current=$(git ls-remote "$remote" "refs/heads/${HEAD_REF}" | cut -f1)
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo "branch moved from $HEAD_SHA to ${current:-<deleted>}; the next run re-locks it"
            exit 0
          fi
          # curl, not gh: self-hosted runners are not guaranteed to have the gh CLI.
          bot_id=$(curl -fsS -H "Authorization: Bearer ${APP_TOKEN}" \
            "https://api.github.com/users/${APP_SLUG}%5Bbot%5D" \
            | grep -Eo '"id": *[0-9]+' | head -1 | grep -Eo '[0-9]+')
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git apply "$PATCH_FILE"
          git add --update -- '*uv.lock'
          git commit -m "chore(deps): re-lock uv projects after dependency update"
          git push "$remote" "HEAD:refs/heads/${HEAD_REF}"
