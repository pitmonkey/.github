name: Reusable - Build Docker

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: asus-amd64-dind
      runner-arm64:
        description: "Runner for native linux/arm64 builds (native-arm64 fallback only)"
        type: string
        default: pi-arm64-dind
      image-name:
        description: "Image name under ghcr.io/<owner>/"
        type: string
        required: true
      dockerfile:
        description: "Path to the Dockerfile (for monorepos with subpath Dockerfiles)."
        type: string
        default: Dockerfile
      build-context:
        description: "Docker build context. Default = repo root."
        type: string
        default: "."
      platforms:
        description: "Multi-platform targets, e.g. 'linux/amd64,linux/arm64'. Empty = native arch only."
        type: string
        default: ""
      native-arm64:
        description: >-
          Multi-arch strategy. false (default) = one buildkit instance on the
          amd64 runner builds every platform (arm64 via QEMU emulation) and
          pushes a complete manifest list atomically. true = the legacy per-arch
          native-runner matrix + merge — use only for a compile-heavy image where
          emulating arm64 source builds is too slow.
        type: boolean
        default: false
      no-cache:
        type: boolean
        default: false
      dockerhub-auth:
        description: "Login to Docker Hub to avoid pull rate limits (requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets)"
        type: boolean
        default: false

# Cancel superseded runs per ref: a rapid push sequence otherwise piles builds
# onto the limited self-hosted runners, and that load amplifies the ghcr
# read-after-write consistency lag the merge job is sensitive to.
concurrency:
  group: build-docker-${{ github.workflow }}-${{ inputs.image-name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A Dependabot pull request never pushes an image (push is already false on
  # pull_request events), so building one only burns time on the self-hosted
  # runners. Key on pull_request.user.login rather than github.actor: on a manual
  # re-run github.actor becomes whoever clicked re-run, which would silently
  # re-enable the build.
  #
  # The `dependabot/docker/` exception is the important half. For a uv or
  # pre-commit bump the Dockerfile is unchanged and the build proves nothing. For
  # a base-image bump the Dockerfile IS the change, and building it is the only
  # test that exists — without this, such a PR reports a green ci-green having
  # never assembled the image. Branch naming is a Dependabot convention rather
  # than a documented API; if it ever changes, this fails toward skipping the
  # build, which is the previous behaviour rather than something broken.
  build:
    if: >-
      inputs.platforms == ''
      && !(github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && !startsWith(github.head_ref, 'dependabot/docker/'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - uses: docker/login-action@v4
        if: inputs.dockerhub-auth
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        # Always log in to ghcr: non-PR events push the image; PR events still
        # need to pull private/internal base images (e.g. an org base image a
        # Dockerfile does `FROM ghcr.io/<owner>/...` on).
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute sortable image tag
        id: sortable
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.sortable.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Private git dependencies (uv `[tool.uv.sources] { git = ... }`): uv shells
          # out to plain `git` INSIDE the build, which has no credential and dies with
          # `fatal: could not read Username for 'https://github.com'`. Passed as a
          # BuildKit secret so it mounts only into the RUN that needs it and never
          # lands in an image layer (unlike a build-arg, which is baked into history).
          #
          # Inert where unused: a Dockerfile that never mounts `ops_ui_token` ignores
          # it, and a caller without the secret passes an empty value.
          secrets: |
            ops_ui_token=${{ secrets.OPS_UI_TOKEN }}
          no-cache: ${{ inputs.no-cache }}
          # Registry cache colocated on ghcr (self-hosted runners have no local
          # layer cache and no LAN registry). READ cache on all events — a fresh
          # ephemeral pod pulls the remote buildcache tag to reuse layers,
          # including on PRs. Only WRITE cache on non-PR events: PRs push nothing,
          # so exporting a fresh mode=max cache there just burns wall-clock (it
          # dominated the old ~28min PR builds).
          cache-from: ${{ !inputs.no-cache && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache', github.repository_owner, inputs.image-name) || '' }}
          # ignore-error: a transient ghcr write on cache export must not fail
          # the whole step when the image push itself succeeded (worst case: a
          # layer is left uncached and the next build is slightly slower).
          cache-to: ${{ (!inputs.no-cache && github.event_name != 'pull_request') && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true', github.repository_owner, inputs.image-name) || '' }}

  # Multi-arch DEFAULT path: a single buildkit instance on the amd64 runner builds
  # every requested platform (arm64 via QEMU emulation) and pushes a complete OCI
  # manifest list ATOMICALLY in one operation. No push-by-digest, no digest
  # artifacts, no separate merge job — therefore no ghcr read-after-write
  # consistency window (the root cause the merge-job retries were band-aiding).
  # Measured on the dispatcher image: warm 12s / cold 179s vs the native matrix's
  # ~106s warm. Python images on glibc `*-slim` install prebuilt aarch64 wheels,
  # so emulation downloads rather than compiles. For a genuinely compile-heavy
  # image, set `native-arm64: true` to use the legacy per-arch matrix below.
  build-multiplatform:
    # Dependabot guard: see the `build` job.
    if: >-
      inputs.platforms != '' && !inputs.native-arm64
      && !(github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && !startsWith(github.head_ref, 'dependabot/docker/'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Register QEMU binfmt handlers for cross-arch emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - uses: docker/login-action@v4
        if: inputs.dockerhub-auth
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        # Always log in to ghcr: non-PR events push the image; PR events still
        # need to pull private/internal base images.
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute sortable image tag
        id: sortable
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.sortable.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          # See the single-arch build job: BuildKit secret for private git deps,
          # inert for Dockerfiles that never mount it.
          secrets: |
            ops_ui_token=${{ secrets.OPS_UI_TOKEN }}
          # One atomic manifest-list push. On PRs push=false: buildx still builds
          # every platform (validation) but exports nothing.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Keep the OCI index clean; provenance attestations can be opted in later.
          provenance: false
          no-cache: ${{ inputs.no-cache }}
          # Single shared buildcache tag (one builder covers all arches). Read on
          # all events; write only on non-PR. ignore-error: a cache-export flake
          # must not fail a build whose image push already succeeded.
          cache-from: ${{ !inputs.no-cache && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache', github.repository_owner, inputs.image-name) || '' }}
          cache-to: ${{ (!inputs.no-cache && github.event_name != 'pull_request') && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true', github.repository_owner, inputs.image-name) || '' }}

  # Multi-arch FALLBACK path (native-arm64: true): the legacy per-arch native
  # runner matrix. Each arch builds push-by-digest on its own native runner, then
  # `merge` assembles the manifest list. Retained for any future compile-heavy
  # image where emulating arm64 source compilation is unacceptably slow. Keeps the
  # ghcr eventual-consistency hardening (per-arch verify loop + merge retry).
  build-native-matrix:
    # Dependabot guard: see the `build` job.
    if: >-
      inputs.platforms != '' && inputs.native-arm64
      && !(github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && !startsWith(github.head_ref, 'dependabot/docker/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ${{ inputs.runner }}
          - platform: linux/arm64
            runner: ${{ inputs.runner-arm64 }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set platform slug
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - uses: docker/login-action@v4
        if: inputs.dockerhub-auth
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        # Always log in to ghcr: non-PR events push the image; PR events still
        # need to pull private/internal base images (e.g. an org base image a
        # Dockerfile does `FROM ghcr.io/<owner>/...` on).
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          # See the single-arch build job: BuildKit secret for private git deps,
          # inert for Dockerfiles that never mount it.
          secrets: |
            ops_ui_token=${{ secrets.OPS_UI_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }},push-by-digest=true,name-canonical=true
          no-cache: ${{ inputs.no-cache }}
          # Per-platform registry cache tag. Read on all events (incl. PRs);
          # write only on non-PR events (see single-arch build job for rationale).
          cache-from: ${{ !inputs.no-cache && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache-{2}', github.repository_owner, inputs.image-name, env.PLATFORM_PAIR) || '' }}
          # ignore-error: see single-arch build job — cache-export flakes must
          # not fail a build whose image push already succeeded.
          cache-to: ${{ (!inputs.no-cache && github.event_name != 'pull_request') && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache-{2},mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true', github.repository_owner, inputs.image-name, env.PLATFORM_PAIR) || '' }}

      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Push-by-digest can report success while the manifest is not yet resolvable
      # in ghcr (registry eventual-consistency, especially under load on self-hosted
      # runners). The merge job then fails with "@sha256:...: not found". Block here
      # until the just-pushed digest actually resolves, so a genuine push miss fails
      # this (retryable) build job instead of silently poisoning merge.
      - name: Verify pushed digest is resolvable in ghcr
        if: github.event_name != 'pull_request'
        run: |
          ref="ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}"
          for i in $(seq 1 6); do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "verified $ref"
              exit 0
            fi
            echo "attempt $i: $ref not resolvable yet, retrying in 10s"
            sleep 10
          done
          echo "::error::pushed digest $ref never became resolvable in ghcr"
          exit 1

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          # Namespace by image-name: a caller that builds several images in one run
          # invokes this reusable workflow once per image, and artifacts are scoped
          # to the whole run. Without the image-name qualifier every image's merge
          # would pull every other image's per-arch digests (pattern digests-* +
          # merge-multiple) and assemble a manifest from foreign digests -> the
          # intermittent `@sha256:...: not found` seen across a multi-image repo.
          name: digests-${{ inputs.image-name }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: inputs.platforms != '' && inputs.native-arm64 && github.event_name != 'pull_request'
    needs: build-native-matrix
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # Pin to the same major as the upload step (v7); a v7-upload / v8-download
      # mismatch surfaced as `digest-mismatch: error` on the artifact download.
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          # Only this image's per-arch digests (see the upload step's rationale).
          pattern: digests-${{ inputs.image-name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Compute sortable image tag
        id: sortable
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.sortable.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        # Retry to absorb any residual ghcr consistency lag between the per-arch
        # pushes (verified in each build job) and this manifest assembly.
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=$(printf 'ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}@sha256:%s ' *)
          for i in $(seq 1 5); do
            if docker buildx imagetools create $tags $sources; then
              echo "manifest created"
              exit 0
            fi
            echo "attempt $i to create manifest failed, retrying in 15s"
            sleep 15
          done
          echo "::error::failed to create manifest after retries"
          exit 1
