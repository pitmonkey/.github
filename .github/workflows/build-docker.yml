name: Reusable - Build Docker

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: asus-amd64-dind
      runner-arm64:
        description: "Runner for native linux/arm64 builds"
        type: string
        default: pi-arm64-dind
      image-name:
        description: "Image name under ghcr.io/<owner>/"
        type: string
        required: true
      dockerfile:
        description: "Path to the Dockerfile (for monorepos with subpath Dockerfiles)."
        type: string
        default: Dockerfile
      build-context:
        description: "Docker build context. Default = repo root."
        type: string
        default: "."
      platforms:
        description: "Multi-platform targets, e.g. 'linux/amd64,linux/arm64'. Empty = native arch only."
        type: string
        default: ""
      no-cache:
        type: boolean
        default: false
      dockerhub-auth:
        description: "Login to Docker Hub to avoid pull rate limits (requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets)"
        type: boolean
        default: false

jobs:
  build:
    if: inputs.platforms == ''
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - uses: docker/login-action@v4
        if: inputs.dockerhub-auth
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        # Always log in to ghcr: non-PR events push the image; PR events still
        # need to pull private/internal base images (e.g. an org base image a
        # Dockerfile does `FROM ghcr.io/<owner>/...` on).
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute sortable image tag
        id: sortable
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.sortable.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: ${{ inputs.no-cache }}
          # Registry cache colocated on ghcr (self-hosted runners have no local
          # layer cache and no LAN registry). READ cache on all events — a fresh
          # ephemeral pod pulls the remote buildcache tag to reuse layers,
          # including on PRs. Only WRITE cache on non-PR events: PRs push nothing,
          # so exporting a fresh mode=max cache there just burns wall-clock (it
          # dominated the old ~28min PR builds).
          cache-from: ${{ !inputs.no-cache && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache', github.repository_owner, inputs.image-name) || '' }}
          cache-to: ${{ (!inputs.no-cache && github.event_name != 'pull_request') && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd', github.repository_owner, inputs.image-name) || '' }}

  build-multiplatform:
    if: inputs.platforms != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ${{ inputs.runner }}
          - platform: linux/arm64
            runner: ${{ inputs.runner-arm64 }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set platform slug
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - uses: docker/login-action@v4
        if: inputs.dockerhub-auth
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        # Always log in to ghcr: non-PR events push the image; PR events still
        # need to pull private/internal base images (e.g. an org base image a
        # Dockerfile does `FROM ghcr.io/<owner>/...` on).
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }},push-by-digest=true,name-canonical=true
          no-cache: ${{ inputs.no-cache }}
          # Per-platform registry cache tag. Read on all events (incl. PRs);
          # write only on non-PR events (see single-arch build job for rationale).
          cache-from: ${{ !inputs.no-cache && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache-{2}', github.repository_owner, inputs.image-name, env.PLATFORM_PAIR) || '' }}
          cache-to: ${{ (!inputs.no-cache && github.event_name != 'pull_request') && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache-{2},mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd', github.repository_owner, inputs.image-name, env.PLATFORM_PAIR) || '' }}

      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Push-by-digest can report success while the manifest is not yet resolvable
      # in ghcr (registry eventual-consistency, especially under load on self-hosted
      # runners). The merge job then fails with "@sha256:...: not found". Block here
      # until the just-pushed digest actually resolves, so a genuine push miss fails
      # this (retryable) build job instead of silently poisoning merge.
      - name: Verify pushed digest is resolvable in ghcr
        if: github.event_name != 'pull_request'
        run: |
          ref="ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}"
          for i in $(seq 1 6); do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "verified $ref"
              exit 0
            fi
            echo "attempt $i: $ref not resolvable yet, retrying in 10s"
            sleep 10
          done
          echo "::error::pushed digest $ref never became resolvable in ghcr"
          exit 1

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: inputs.platforms != '' && github.event_name != 'pull_request'
    needs: build-multiplatform
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # Pin to the same major as the upload step (v7); a v7-upload / v8-download
      # mismatch surfaced as `digest-mismatch: error` on the artifact download.
      - uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Compute sortable image tag
        id: sortable
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.sortable.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        # Retry to absorb any residual ghcr consistency lag between the per-arch
        # pushes (verified in each build job) and this manifest assembly.
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=$(printf 'ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}@sha256:%s ' *)
          for i in $(seq 1 5); do
            if docker buildx imagetools create $tags $sources; then
              echo "manifest created"
              exit 0
            fi
            echo "attempt $i to create manifest failed, retrying in 15s"
            sleep 15
          done
          echo "::error::failed to create manifest after retries"
          exit 1
