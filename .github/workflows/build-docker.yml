name: Reusable - Build Docker

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: asus-amd64-dind
      image-name:
        description: "Image name under ghcr.io/<owner>/"
        type: string
        required: true
      platforms:
        description: "Multi-platform targets, e.g. 'linux/amd64,linux/arm64'. Empty = native arch."
        type: string
        default: ""
      no-cache:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2

      - if: ${{ inputs.platforms != '' }}
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: ${{ inputs.platforms }}
          no-cache: ${{ inputs.no-cache }}
