name: Reusable - Build Docker

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: asus-amd64-dind
      runner-arm64:
        description: "Runner for native linux/arm64 builds"
        type: string
        default: pi-arm64-dind
      image-name:
        description: "Image name under ghcr.io/<owner>/"
        type: string
        required: true
      dockerfile:
        description: "Path to the Dockerfile (for monorepos with subpath Dockerfiles)."
        type: string
        default: Dockerfile
      build-context:
        description: "Docker build context. Default = repo root."
        type: string
        default: "."
      platforms:
        description: "Multi-platform targets, e.g. 'linux/amd64,linux/arm64'. Empty = native arch only."
        type: string
        default: ""
      no-cache:
        type: boolean
        default: false
      dockerhub-auth:
        description: "Login to Docker Hub to avoid pull rate limits (requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets)"
        type: boolean
        default: false

jobs:
  build:
    if: inputs.platforms == ''
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - uses: docker/login-action@v4
        if: inputs.dockerhub-auth
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        # Always log in to ghcr: non-PR events push the image; PR events still
        # need to pull private/internal base images (e.g. an org base image a
        # Dockerfile does `FROM ghcr.io/<owner>/...` on).
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: ${{ inputs.no-cache }}
          # Registry cache colocated on ghcr (self-hosted runners have no local
          # layer cache and no LAN registry). Only read/write cache on non-PR
          # events: PRs push nothing, so exporting a fresh cache there just burns
          # wall-clock (mode=max export dominated the old ~28min PR builds).
          cache-from: ${{ (!inputs.no-cache && github.event_name != 'pull_request') && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache', github.repository_owner, inputs.image-name) || '' }}
          cache-to: ${{ (!inputs.no-cache && github.event_name != 'pull_request') && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd', github.repository_owner, inputs.image-name) || '' }}

  build-multiplatform:
    if: inputs.platforms != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ${{ inputs.runner }}
          - platform: linux/arm64
            runner: ${{ inputs.runner-arm64 }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set platform slug
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - uses: docker/login-action@v4
        if: inputs.dockerhub-auth
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        # Always log in to ghcr: non-PR events push the image; PR events still
        # need to pull private/internal base images (e.g. an org base image a
        # Dockerfile does `FROM ghcr.io/<owner>/...` on).
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }},push-by-digest=true,name-canonical=true
          no-cache: ${{ inputs.no-cache }}
          # Per-platform registry cache tag; only on non-PR events (see the
          # single-arch build job above for rationale).
          cache-from: ${{ (!inputs.no-cache && github.event_name != 'pull_request') && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache-{2}', github.repository_owner, inputs.image-name, env.PLATFORM_PAIR) || '' }}
          cache-to: ${{ (!inputs.no-cache && github.event_name != 'pull_request') && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache-{2},mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd', github.repository_owner, inputs.image-name, env.PLATFORM_PAIR) || '' }}

      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: inputs.platforms != '' && github.event_name != 'pull_request'
    needs: build-multiplatform
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}@sha256:%s ' *)
