name: Reusable - Test Python

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: pi-arm64
      uv-sync-args:
        type: string
        default: ""
      test-path:
        type: string
        default: tests/

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync ${{ inputs.uv-sync-args }}
      - run: uv run pytest ${{ inputs.test-path }} -v
